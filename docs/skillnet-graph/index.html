<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>SkillNet Interactive Graph</title>
  <style>
    :root {
      --ink: #f7f9fc;
      --muted: #9ba9bf;
      --panel: rgba(14, 24, 42, .92);
      --border: rgba(255, 255, 255, .11);
      --brand: #a6192e;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(166, 25, 46, .21), transparent 32%),
        radial-gradient(circle at 88% 15%, rgba(47, 105, 191, .15), transparent 30%),
        #07101e;
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    .shell { width: 100%; height: 100%; padding: 14px; }
    .panel {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(20, 31, 52, .97), rgba(8, 16, 30, .96));
      box-shadow: 0 26px 70px rgba(0, 0, 0, .36), inset 0 1px 0 rgba(255, 255, 255, .04);
    }
    .toolbar {
      min-height: 82px;
      display: grid;
      grid-template-columns: minmax(190px, .8fr) minmax(470px, 1.65fr) 90px;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }
    .kicker, .subtitle, .stat-label, .note, .tip p { margin: 0; }
    .kicker, .stat-label {
      color: #8392aa;
      font: 700 10px/1.2 Consolas, monospace;
      letter-spacing: .13em;
    }
    h1 { margin: 4px 0 0; font-size: clamp(17px, 2vw, 24px); letter-spacing: -.025em; }
    .subtitle { margin-top: 3px; color: #8e9bb0; font-size: 11px; }
    .tabs { display: grid; grid-template-columns: repeat(5, minmax(82px, 1fr)); gap: 7px; }
    .tab {
      min-height: 39px;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: rgba(255, 255, 255, .04);
      color: #aeb9ca;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .tab:hover { transform: translateY(-1px); border-color: rgba(255,255,255,.2); color: #fff; }
    .tab.active { border-color: var(--relation); background: color-mix(in srgb, var(--relation) 17%, transparent); color: #fff; box-shadow: inset 0 -2px 0 var(--relation); }
    .stat { text-align: right; }
    .stat strong { display: block; color: var(--relation); font-size: 28px; line-height: 1; }
    .stat-label { display: block; margin-top: 4px; font-size: 8px; }
    .stage {
      position: relative;
      min-height: 0;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .legend {
      position: absolute;
      top: 15px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      max-width: calc(100% - 170px);
      pointer-events: none;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(5, 12, 24, .72);
      color: #cbd4e2;
      font-size: 10px;
      backdrop-filter: blur(10px);
    }
    .legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--department); box-shadow: 0 0 10px var(--department); }
    .reset {
      position: absolute;
      top: 15px;
      right: 16px;
      min-height: 31px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 9px;
      background: rgba(5, 12, 24, .74);
      color: #cbd4e2;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }
    .note {
      position: absolute;
      left: 16px;
      bottom: 14px;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 9px;
      background: rgba(5,12,24,.68);
      color: #91a0b6;
      font-size: 10px;
      pointer-events: none;
    }
    .tip {
      position: absolute;
      display: none;
      min-width: 140px;
      padding: 9px 11px;
      transform: translate(14px, -50%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 11px;
      background: rgba(5,12,23,.92);
      box-shadow: 0 12px 30px rgba(0,0,0,.32);
      pointer-events: none;
    }
    .tip .title { font-size: 11px; font-weight: 750; }
    .tip .meta { margin-top: 3px; color: #8e9bb0; font-size: 9px; }
    @media (max-width: 760px) {
      .shell { padding: 6px; }
      .panel { border-radius: 14px; }
      .toolbar { grid-template-columns: 1fr auto; gap: 8px; padding: 10px; }
      .tabs { grid-column: 1 / -1; grid-row: 2; }
      .subtitle { display: none; }
      .note { display: none; }
    }
  </style>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

        <div class="tip" id="tip"><p class="title"></p><p class="meta"></p></div>
      </div>
    </section>
  </main>

    const resize = () => {

    const release = event => { if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId); dragged = null; };
    canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("pointerleave", () => { if (!dragged) { hovered = null; tip.style.display = "none"; } });

    const arrow = (ctx, source, target, color, opacity) => {
      const angle = Math.atan2(target.y - source.y, target.x - source.x), radius = 8;
      const x = target.x - Math.cos(angle) * 10, y = target.y - Math.sin(angle) * 10;
      ctx.save(); ctx.globalAlpha = opacity; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, y);
      ctx.lineTo(x - Math.cos(angle - Math.PI / 6) * radius, y - Math.sin(angle - Math.PI / 6) * radius);
      ctx.lineTo(x - Math.cos(angle + Math.PI / 6) * radius, y - Math.sin(angle + Math.PI / 6) * radius);

    };
    const animate = () => {
      const ctx = canvas.getContext("2d"), lookup = new Map(nodes.map(node => [node.id, node]));
      const localAlpha = Math.max(alpha, dragged ? .35 : .025);
      if (localAlpha > .026) {
        for (let left = 0; left < nodes.length; left++) for (let right = left + 1; right < nodes.length; right++) {
          const a = nodes[left], b = nodes[right]; let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = 1; dy = 0; d2 = 1; } const distance = Math.sqrt(d2), force = 1050 * localAlpha / Math.max(d2, 90);
          const fx = dx / distance * force, fy = dy / distance * force;
          if (!a.pinned || a === dragged) { a.vx -= fx; a.vy -= fy; }
          if (!b.pinned || b === dragged) { b.vx += fx; b.vy += fy; }
        }
        for (const edge of filtered) {
          const source = lookup.get(edge.source), target = lookup.get(edge.target); if (!source || !target) continue;
          const dx = target.x - source.x, dy = target.y - source.y, distance = Math.max(1, Math.hypot(dx, dy));
          const desired = source.department === target.department ? 86 : 150, force = (distance - desired) * .0042 * localAlpha;
          const fx = dx / distance * force, fy = dy / distance * force;
          if (!source.pinned || source === dragged) { source.vx += fx; source.vy += fy; }
          if (!target.pinned || target === dragged) { target.vx -= fx; target.vy -= fy; }
        }
        for (const node of nodes) {
          if (node === dragged) continue;
          const center = departments[node.department].center;
          node.vx += (center[0] * width - node.x) * .00032 * localAlpha;
          node.vy += (center[1] * height - node.y) * .00032 * localAlpha;
          node.vx += (width / 2 - node.x) * .00008 * localAlpha;
          node.vy += (height / 2 - node.y) * .00008 * localAlpha;
          node.vx *= .88; node.vy *= .88;
          if (!node.pinned) { node.x += node.vx; node.y += node.vy; }
          node.x = Math.max(26, Math.min(width - 26, node.x)); node.y = Math.max(58, Math.min(height - 24, node.y));
        }
        alpha = Math.max(.025, alpha * .992);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, width, height);
      for (const department of departmentOrder) {
        const center = departments[department].center;
        const gradient = ctx.createRadialGradient(center[0] * width, center[1] * height, 0, center[0] * width, center[1] * height, Math.min(width, height) * .25);
        gradient.addColorStop(0, departments[department].color + "18"); gradient.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, width, height);
      }
      const connectedIds = new Set();
      if (hovered) { connectedIds.add(hovered.id); filtered.forEach(edge => { if (edge.source === hovered.id) connectedIds.add(edge.target); if (edge.target === hovered.id) connectedIds.add(edge.source); }); }
      for (const edge of filtered) {
        const source = lookup.get(edge.source), target = lookup.get(edge.target); if (!source || !target) continue;
        const isConnected = !hovered || edge.source === hovered.id || edge.target === hovered.id;
        const opacity = hovered ? (isConnected ? .95 : .07) : active === "all" ? .3 : .67;
        ctx.save(); ctx.globalAlpha = opacity; ctx.strokeStyle = relations[edge.type].color; ctx.lineWidth = isConnected && hovered ? 2.1 : 1.1;
        if (edge.type === "conflict") ctx.setLineDash([7, 5]); if (edge.type === "mutex") ctx.setLineDash([2, 6]);
        ctx.beginPath(); ctx.moveTo(source.x, source.y); ctx.lineTo(target.x, target.y); ctx.stroke(); ctx.restore();
        if (edge.directed) arrow(ctx, source, target, relations[edge.type].color, opacity);
      }
      for (const node of nodes) {
        const selected = !hovered || node.id === hovered.id || connectedIds.has(node.id), radius = node.id === hovered?.id ? 10 : 7;
        ctx.save(); ctx.globalAlpha = selected ? 1 : .2; ctx.shadowColor = departments[node.department].color; ctx.shadowBlur = node.id === hovered?.id ? 23 : 11;
        ctx.fillStyle = departments[node.department].color; ctx.strokeStyle = "#F7FAFF"; ctx.lineWidth = node.pinned ? 2.4 : 1.3;
        ctx.beginPath(); ctx.arc(node.x, node.y, radius, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke(); ctx.restore();
      }
      requestAnimationFrame(animate);
    };
    setActive("all"); requestAnimationFrame(animate);
    if (window.Office && window.Office.onReady) window.Office.onReady(() => {});
  })();
